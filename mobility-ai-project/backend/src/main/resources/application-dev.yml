# =====================================================================
# 개발 프로파일 : SQL 로그를 켜고 로컬 업로드 경로를 사용한다.
# =====================================================================
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.mobility.ai: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: INFO

app:
  storage:
    upload-dir: ${UPLOAD_DIR:./data/uploads}
