# DINO 번호판 검출 설정 예시 (CPU 추론 전제, 단일 클래스)
# 파일: ch04/04_dino/dino_config.yaml
# 주의: 실제 DINO 구현체(IDEA-Research/DINO)의 설정 키 이름은
#       버전에 따라 다르다. 아래는 개념을 정리한 예시이며,
#       사용하려는 저장소의 config 형식에 맞춰 옮겨 적어야 한다.

model:
  name: dino
  num_classes: 1              # 번호판 한 종류 (배경은 별도 처리)
  num_queries: 100            # COCO 기본 900 -> 번호판은 크게 줄인다
  hidden_dim: 256             # d_model
  nheads: 8
  enc_layers: 6               # 인코더 레이어. 비용 절감 시 먼저 줄인다
  dec_layers: 6               # 디코더 레이어. 반복 갱신에 기여하므로 유지
  dim_feedforward: 2048       # FFN 확장 차원 (hidden_dim x 8)
  dropout: 0.0                # DINO 는 추론 성능을 위해 0 을 쓴다
  num_feature_levels: 4       # stride 8/16/32/64
  dec_n_points: 4             # 디코더 샘플링 점 수
  enc_n_points: 4             # 인코더 샘플링 점 수

backbone:
  name: resnet50
  pretrained: true            # ImageNet 사전학습 필수
  dilation: false
  return_interm_indices: [1, 2, 3]   # C3, C4, C5
  lr_backbone: 1.0e-5         # 백본은 본체보다 10배 낮게

# DINO 의 세 가지 핵심 개선
query_selection:
  two_stage_type: standard    # 인코더 출력에서 상위 제안을 쿼리로 선택
  two_stage_bbox_embed_share: false
  two_stage_class_embed_share: false
  num_select: 100             # 인코더 제안 중 선택할 개수

denoising:
  use_dn: true
  dn_number: 100              # DN 쿼리 총수 (그룹 수 x 2 x 객체 수)
  dn_box_noise_scale: 0.4     # lambda_1 : positive 그룹 노이즈
  dn_label_noise_ratio: 0.5   # 라벨 플립 비율 (단일 클래스에서는 무효)
  dn_labelbook_size: 1        # num_classes 와 일치시킨다
  # CDN 의 negative 그룹은 구현에 따라 lambda_2 = 2 x lambda_1 로 둔다

look_forward_twice: true      # 박스 갱신 기울기를 두 레이어에 전달

# 손실 가중치
loss:
  cls_loss_coef: 1.0          # focal loss 기반
  bbox_loss_coef: 5.0         # L1
  giou_loss_coef: 2.0         # 1 - GIoU
  focal_alpha: 0.25
  focal_gamma: 2.0
  aux_loss: true              # 디코더 중간 레이어 보조 손실
  interm_loss: true           # 인코더 제안에도 손실 부여

# 학습 설정 (GPU 1장 기준. CPU 학습은 권장하지 않는다)
train:
  epochs: 50                  # COCO 12/24/36 ep + 번호판 미세조정
  lr: 1.0e-4
  lr_drop: 40
  weight_decay: 1.0e-4
  batch_size: 2               # 메모리에 맞춰 조정
  clip_max_norm: 0.1          # 기울기 클리핑. 생략하면 NaN 위험
  optimizer: adamw

data:
  train_image_dir: dataset/plates/images/train
  train_ann_file: dataset/plates/annotations/train.json
  val_image_dir: dataset/plates/images/val
  val_ann_file: dataset/plates/annotations/val.json
  # COCO 형식 JSON. 2.4절에서 만든 YOLO 라벨을 변환해 사용한다
  max_size: 1333              # 긴 변 최대 길이
  scales: [480, 512, 544, 576, 608, 640, 672, 704, 736, 768, 800]
  horizontal_flip: true       # 검출 전용. OCR 학습에는 쓰지 않는다

# CPU 추론 설정
inference:
  device: cpu
  num_threads: 4              # torch.set_num_threads 와 동일하게
  score_threshold: 0.3        # 번호판 단일 클래스이므로 낮게 시작
  max_detections: 20          # 이미지당 번호판 상한
  # NMS 는 기본적으로 쓰지 않는다. 중복이 보이면 IoU 0.7 로 추가 검토
